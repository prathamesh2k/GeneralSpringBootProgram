name: Multi Stage Pipeline

on:
 workflow_dispatch:
  inputs:
   BUILD_ENVIRONMENT:
    type: environment
    default: dev
   develop_branch:
    required: true
    default: 'development'
    type: choice
    options:
        - development
        - feature
        - pre-prod
        - prod
   TEST_ENVIRONMENT:
    type: environment
    default: staging
   feature_branch:
    required: true
    default: 'feature'
    type: choice
    options:
        - development
        - feature
        - pre-prod
        - prod
   UAT_ENVIRONMENT:
    type: environment
    default: uat
   pre-prod_branch:
    required: true
    #type: string
    default: 'pre-prod'
    type: choice
    options:
        - development
        - feature
        - pre-prod
        - prod
   PROD_ENVIRONMENT:
    type: environment
    default: prod
   prod_branch:
    required: true
    #type: string
    default: 'prod'
    type: choice
    options:
        - development
        - feature
        - pre-prod
        - prod

jobs:
  CI_Non_container_Build:
   runs-on: ubuntu-latest
   environment: ${{ inputs.BUILD_ENVIRONMENT }}
   steps:
    - name: Checkout
      uses: actions/checkout@v4.2.2
      with:
          ref: ${{ github.event.inputs.develop_branch }} # Use the input branch
    - name: Run script on target branch
      run: |
          echo "Running on branch: ${{ github.event.inputs.develop_branch }}"
    - name: Setup Java JDK
      uses: actions/setup-java@v3.14.1
      with: 
       java-version: 17
       distribution: microsoft
    - name: Get current date
      id: date
      run: echo "MY_DATE=$(date +%Y-%m-%d-%H-%M)" >> $GITHUB_ENV
    - name: Build using Maven
      run: mvn --batch-mode --update-snapshots verify
    - run: mkdir staging && cp target/*.jar staging
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4.6.2
      with:
       name: artifact_${{ vars.env_name }}-${{ env.MY_DATE }}
       path: staging
    - run: echo 'Environment Secret is ${{secrets.secret}}, Environment Variable is ${{ vars.variable }}'
